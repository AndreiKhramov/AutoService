services:

  web:
    build: .
    env_file:
      - .env
    container_name: web
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: db
    restart: always

    env_file:
     - .env

    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}

    ports:
      - '5432:5432'

    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:


      
