services:

  db:
    image: postgres:15
    container_name: db
    restart: always

    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}

    ports:
      - '5433:5432'

    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    env_file:
      - .env

    environment:
      PGHOST: db
      PGPORT: "5432"

    container_name: web

    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pg_data:



      
